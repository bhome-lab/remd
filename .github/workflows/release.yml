name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of an existing v-prefixed tag and draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install NSIS 3.12
        shell: pwsh
        run: choco install nsis --version 3.12.0 --yes --no-progress --allow-downgrade
      - name: Build and test
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./installer/Build-Installer.ps1 -Version $env:VERSION -Compiler 'C:\Program Files (x86)\NSIS\makensis.exe'
      - name: Upload and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release upload $tag installer/out/RemoteControl-Setup.exe installer/out/RemoteControl-Setup.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $tag --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
